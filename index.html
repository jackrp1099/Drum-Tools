<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drum Tools</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── TOP NAV ── */
  #top-nav {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #1A1A1A;
    border-bottom: 2px solid #333;
    padding: 8px 16px;
    flex-shrink: 0;
    z-index: 1000;
  }

  #top-nav .logo {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.08em;
    color: #EEE;
    white-space: nowrap;
  }

  #tool-select-wrap {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #tool-select-wrap label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #888;
    white-space: nowrap;
  }

  #toolSelect {
    background: #2A2A2A;
    color: #EEE;
    border: 1px solid #555;
    border-radius: 4px;
    font-size: 13px;
    padding: 5px 10px;
    cursor: pointer;
    outline: none;
    min-width: 160px;
  }
  #toolSelect:hover { border-color: #888; }
  #toolSelect option { background: #222; }

  /* ── TOOL FRAMES ── */
  #tool-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .tool-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    visibility: hidden;
    pointer-events: none;
    background: black;
  }
  .tool-frame.active {
    visibility: visible;
    pointer-events: all;
  }

  /* Drum Arranger is loaded inline, not as iframe */
  #drum-arranger-wrap {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    overflow: auto;
    background: #EDE8E0;
  }
  #drum-arranger-wrap.active { display: block; }
</style>
</head>
<body>

<nav id="top-nav">
  <div class="logo">🥁 Drum Tools</div>
  <div id="tool-select-wrap">
    <label>Tool</label>
    <select id="toolSelect" onchange="switchTool(this.value)">
      <option value="drum-arranger">Drum Arranger</option>
      <option value="around-the-kit">Around the Kit</option>
      <option value="pictures">Pictures</option>
    </select>
  </div>
</nav>

<div id="tool-container">
  <iframe id="frame-around-the-kit" class="tool-frame" src="around_kit.html"></iframe>
  <iframe id="frame-pictures"       class="tool-frame" src="Pictures.html"></iframe>
  <iframe id="frame-drum-arranger"  class="tool-frame active" src="drum-arranger.html"></iframe>
</div>

<script>
function switchTool(tool) {
  document.querySelectorAll('.tool-frame').forEach(f => f.classList.remove('active'));
  const frame = document.getElementById('frame-' + tool);
  if (!frame) return;
  frame.classList.add('active');

  // Kick canvas-based tools: resize and restart draw loop if needed
  try {
    const iWin = frame.contentWindow;
    if (iWin && typeof iWin.resizeCanvas === 'function') {
      iWin.resizeCanvas();
    }
    if (iWin && typeof iWin.draw === 'function') {
      iWin.draw();
    }
  } catch(e) {}
}
</script>

</body>
</html>
