<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Groove</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --paper: #F5EFE4;
  --paper2: #EDE5D6;
  --paper3: #E3D9C6;
  --ink: #1C1814;
  --ink2: #4A4440;
  --ink3: #8A8480;
  --red: #B83030;
  --blue: #1A4A7A;
  --staff: #2A2420;
  --border: #CCC5B5;
  --mono: 'Courier New', Courier, monospace;
  --serif: Georgia, 'Times New Roman', serif;
}

body {
  background: var(--paper2);
  color: var(--ink);
  font-family: var(--mono);
  min-height: 100vh;
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 24px;
  margin-bottom: 20px;
  font-family: var(--serif);
}

.difficulty-select {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.difficulty-btn {
  padding: 8px 16px;
  border: 1px solid var(--border);
  background: transparent;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 12px;
  text-transform: uppercase;
  color: var(--ink3);
  transition: all 0.15s;
}

.difficulty-btn.active {
  background: var(--red);
  border-color: var(--red);
  color: white;
}

.difficulty-btn:hover:not(.active) {
  border-color: var(--red);
  color: var(--red);
}

.main-container {
  max-width: 900px;
  margin: 0 auto;
}

.gg-panel {
  background: white;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 20px;
  margin-bottom: 16px;
}

.gg-panel-title {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink3);
  margin-bottom: 12px;
  font-weight: bold;
}

.gg-panel-controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 12px;
}

button {
  padding: 8px 14px;
  border: 1px solid var(--border);
  background: transparent;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink);
  transition: all 0.15s;
}

button:hover {
  border-color: var(--red);
  color: var(--red);
}

button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

#ggHsList {
  padding: 8px 0;
}

.gg-hs-row {
  display: flex;
  align-items: center;
  padding: 5px 14px;
  gap: 12px;
  border-bottom: 1px solid var(--paper3);
  transition: background 0.1s;
}

.gg-hs-row:hover {
  background: var(--paper3);
}

.gg-hs-rank {
  font-size: 11px;
  color: var(--ink3);
  width: 28px;
  text-align: right;
  flex-shrink: 0;
}

.gg-hs-score {
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
  width: 36px;
  text-align: center;
  flex-shrink: 0;
}

.gg-hs-score.gold { color: #D4A000; }
.gg-hs-score.silver { color: #888; }
.gg-hs-score.bronze { color: #A0632A; }

.gg-hs-name {
  font-family: var(--serif);
  font-style: italic;
  font-size: 18px;
  color: var(--ink2);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100px;
  transition: color 0.1s;
  flex: 1;
  min-width: 0;
}

.gg-hs-name:hover { color: var(--red); }

.gg-hs-name-input {
  font-family: var(--serif);
  font-style: italic;
  font-size: 18px;
  width: 100px;
  border: none;
  border-bottom: 1px solid var(--red);
  background: transparent;
  color: var(--ink);
  outline: none;
  padding: 1px 2px;
}

.gg-hs-score-input {
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 700;
  width: 36px;
  border: none;
  border-bottom: 1px solid var(--red);
  background: transparent;
  color: var(--ink);
  outline: none;
  padding: 1px 2px;
  text-align: center;
  flex-shrink: 0;
}

.gg-hs-new-row {
  display: flex;
  align-items: center;
  padding: 5px 14px;
  gap: 6px;
  border-bottom: 1px solid var(--paper3);
  background: rgba(184,48,48,0.04);
}

.gg-hs-delete-btn {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s;
  background: transparent;
  border: none;
  color: var(--ink3);
  font-size: 13px;
  font-family: var(--mono);
  cursor: pointer;
  padding: 0 2px;
  flex-shrink: 0;
  line-height: 1;
}

.gg-hs-row:hover .gg-hs-delete-btn {
  opacity: 1;
  pointer-events: all;
}

.gg-hs-delete-btn:hover { color: var(--red); }

#ggHsAddBtn {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 8px auto 4px;
  width: 28px; height: 28px;
  border: 2px dashed var(--border);
  border-radius: 50%;
  background: transparent;
  color: var(--ink3);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  font-family: var(--mono);
  font-weight: 300;
  transition: all 0.15s;
  flex-shrink: 0;
}

#ggHsAddBtn:hover {
  border-color: var(--red);
  color: var(--red);
  background: #F5EAE0;
}

#ggHsEmpty {
  padding: 24px 14px;
  font-size: 11px;
  color: var(--ink3);
  text-align: center;
  font-family: var(--mono);
  line-height: 1.6;
}

/* Confetti animation */
@keyframes confetti-fall {
  0% {
    opacity: 1;
    transform: translate(0, 0) rotate(0deg);
  }
  100% {
    opacity: 0;
    transform: translate(var(--tx), var(--ty)) rotate(360deg);
  }
}

.confetti {
  position: fixed;
  pointer-events: none;
  font-size: 20px;
  z-index: 9999;
  animation: confetti-fall 2.5s ease-out forwards;
}

.gg-grid-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--mono);
  font-size: 12px;
}

.gg-grid-table thead {
  background: var(--paper2);
}

.gg-grid-table th {
  padding: 8px 4px;
  text-align: center;
  font-weight: normal;
  color: var(--ink3);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  font-size: 10px;
}

.gg-grid-table th.gg-beat {
  font-weight: bold;
  color: var(--ink2);
}

.gg-grid-table th.gg-bar {
  border-right: 2px solid var(--border);
}

.gg-grid-table td {
  padding: 0;
  border: 1px solid var(--border);
  width: 40px;
  height: 40px;
  text-align: center;
}

.gg-grid-table td.gg-label {
  background: var(--paper2);
  border-right: 2px solid var(--border);
  padding: 8px;
  width: auto;
  text-align: left;
  min-width: 60px;
  font-weight: bold;
}

.gg-grid-table td.gg-cell {
  position: relative;
  cursor: pointer;
  background: white;
}

.gg-grid-table td.gg-cell:hover { background: var(--paper3); }

.gg-grid-table td.gg-bdiv { border-left: 2px solid var(--border); }
.gg-grid-table td.gg-bbar { border-left: 2px solid var(--border); }

.nd {
  width: 18px; height: 18px;
  border: 1px solid var(--border);
  border-radius: 50%;
  margin: auto;
  background: transparent;
  cursor: pointer;
  transition: all 0.1s;
}

.nd.on        { background: var(--blue); border-color: #0F3A6A; }
.nd.on.xhead  { background: var(--blue); border-color: #0F3A6A; }
.nd.on.crash  { background: #C94A00; border-color: #7A2800; }
.nd.on.crash.xhead { background: #C94A00; border-color: #7A2800; }
.nd.on.ride   { background: #1A7A50; border-color: #0A4A2E; }
.nd.on.ride.xhead  { background: #1A7A50; border-color: #0A4A2E; }
.nd.acc       { background: var(--red);  border-color: #7A1010; }
.nd.acc.xhead { background: var(--red);  border-color: #7A1010; }
.nd.ghost     { background: #C8D8C0; border-color: #3A6A30; }

.nd.correct { background: #4A8A4A; border-color: #2A5A2A; }
.nd.wrong   { background: #C85050; border-color: #8A2020; }

.gg-result {
  text-align: center;
  margin-top: 16px;
  font-size: 14px;
  min-height: 20px;
}

.gg-result.pass { color: #2A6A2A; }
.gg-result.fail { color: var(--red); }

.gg-streak-display {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin-top: 16px;
  color: var(--ink);
}

.gg-streak-display span {
  color: var(--red);
}

.gg-mode-buttons {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}

.gg-mode-btn {
  padding: 6px 12px;
  border: 1px solid var(--border);
  background: transparent;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  color: var(--ink3);
  transition: all 0.15s;
}

.gg-mode-btn.active {
  background: var(--paper3);
  border-color: var(--red);
  color: var(--red);
}

.gg-mode-btn:hover:not(.active) {
  border-color: var(--red);
}
</style>
</head>
<body>

<h1>🎯 Guess the Groove</h1>

<div class="difficulty-select">
  <button class="difficulty-btn active" onclick="setDifficulty('easy')">Easy</button>
  <button class="difficulty-btn" onclick="setDifficulty('medium')">Medium</button>
  <button class="difficulty-btn" onclick="setDifficulty('hard')">Hard</button>
</div>

<div class="main-container">
  <div class="gg-panel">
    <div class="gg-panel-title">Answer</div>
    <div id="ggAnswerScore"></div>
    <div class="gg-panel-controls">
      <button id="ggPlayAnswerBtn" style="display:none;" onclick="ggPlayAnswer()">▶ Play</button>
    </div>
  </div>

  <div class="gg-panel">
    <div class="gg-panel-title">Your Guess</div>
    <div id="ggGuessScore"></div>
    <div id="ggGuessGrid"></div>
    <div class="gg-panel-controls">
      <button id="ggPlayGuessBtn" onclick="ggPlayGuess()">▶ Play</button>
      <button id="ggPlayHiddenBtn" onclick="ggPlayHidden()">▶ Hidden</button>
      <button id="ggCheckBtn" onclick="ggCheck()">✓ Check</button>
      <button id="ggRevealBtn" onclick="ggReveal()">👁 Reveal</button>
      <button id="ggResetBtn" onclick="ggResetRound()">↺ Reset</button>
    </div>
    <div id="ggResult" class="gg-result"></div>
    <div class="gg-streak-display">Streak: <span id="ggStreakNum">0</span></div>
  </div>

  <div class="gg-panel">
    <div class="gg-panel-title">High Scores</div>
    <div class="gg-mode-buttons">
      <button class="gg-mode-btn active" id="ggHsModeBtn" onclick="ggSwitchHsMode()">Easy</button>
    </div>
    <div id="ggHsList"></div>
  </div>
</div>

<script>
const GG_HS_KEY = 'gg-high-scores';
const MG_DIV = 16;

let ggDifficulty     = 'easy';
let ggGuessDivision  = 8;
let ggStreak         = 0;
let ggRevealed       = false;
let ggAnswerData     = null;
let ggGuessData      = null;
let ggHsViewMode     = 'easy';

const GG_INSTS = [
  { id: 'hihat', label: 'H.H.', isX: true },
  { id: 'snare', label: 'Snare', isX: false },
  { id: 'kick', label: 'Kick', isX: false }
];

function ggEmptyData(div) {
  const d = { hihat: new Array(div).fill(0), snare: new Array(div).fill(0), kick: new Array(div).fill(0), crash: new Array(div).fill(0), ride: new Array(div).fill(0) };
  [0,2,4,6,8,10,12,14].forEach(s => { if (s < div) d.hihat[s] = 1; });
  d.kick[0] = 1; if (8 < div) d.kick[8] = 1;
  d.snare[4] = 1; if (12 < div) d.snare[12] = 1;
  return d;
}

function setDifficulty(diff) {
  ggDifficulty = diff;
  document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  
  if (diff === 'easy') ggGuessDivision = 8;
  else if (diff === 'medium') ggGuessDivision = 16;
  else ggGuessDivision = 16;
  
  ggAnswerData = ggEmptyData(MG_DIV);
  ggGuessData = ggEmptyData(ggGuessDivision === 8 ? 16 : MG_DIV);
  ggStreak = 0;
  ggRevealed = false;
  document.getElementById('ggStreakNum').textContent = '0';
  document.getElementById('ggResult').textContent = '';
  document.getElementById('ggResult').className = '';
  const revealBtn = document.getElementById('ggRevealBtn');
  if (revealBtn) {
    revealBtn.disabled = false;
    revealBtn.style.opacity = '1';
    revealBtn.style.cursor = 'pointer';
  }
  ggRenderGuessScore();
  ggRenderGuessGrid();
  ggRenderAnswerScore();
  ggRenderHighScores();
}

function ggRenderGuessGrid() {
  const div = ggGuessDivision;
  const spb = div / 4;
  let html = '<thead><tr><th style="background:var(--paper2);border-right:2px solid var(--border);min-width:52px;"></th>';
  for (let s = 0; s < div; s++) {
    const beatIdx = Math.floor(s / spb), sub = s % spb;
    const isBeat = sub === 0, isBar = s === 0;
    let lbl = isBeat ? (beatIdx + 1) : (div === 16 ? ['e','&','a'][sub-1] : div === 8 ? '&' : sub === 2 ? '3' : '');
    const cls = (isBar ? 'gg-bar ' : '') + (isBeat ? 'gg-beat' : '');
    html += `<th class="${cls}">${lbl}</th>`;
  }
  html += '</tr></thead><tbody>';

  GG_INSTS.forEach(inst => {
    html += `<tr><td class="gg-label">${inst.label}</td>`;
    for (let s = 0; s < div; s++) {
      const sub = s % spb;
      const cellCls = 'gg-cell' + (sub === 0 && s > 0 ? ' gg-bdiv' : '') + (s === 0 ? ' gg-bbar' : '');
      const dataStep = div === 8 ? s * 2 : s;
      const state = (ggGuessData[inst.id] || [])[dataStep] || 0;
      const ndCls = getNdClass(state, inst.isX);
      html += `<td class="${cellCls}" data-inst="${inst.id}" data-step="${s}" id="gg-cell-${inst.id}-${s}">
        <div class="nd ${ndCls}" id="gg-nd-${inst.id}-${s}"></div>
      </td>`;
    }
    html += '</tr>';
  });
  html += '</tbody>';

  const wrap = document.getElementById('ggGuessGrid');
  wrap.innerHTML = `<table class="gg-grid-table">${html}</table>`;
  wrap.querySelector('table').onclick = e => {
    if (ggRevealed) return;
    const cell = e.target.closest('[data-inst][data-step]');
    if (!cell) return;
    const inst = cell.dataset.inst, step = +cell.dataset.step;
    const dataStep = ggGuessDivision === 8 ? step * 2 : step;
    ggGuessData[inst][dataStep] = ggGuessData[inst][dataStep] === 0 ? 1 : 0;
    const instObj = GG_INSTS.find(i => i.id === inst);
    const el = document.getElementById(`gg-nd-${inst}-${step}`);
    if (el) el.className = 'nd ' + getNdClass(ggGuessData[inst][dataStep], instObj ? instObj.isX : false);
    const cb = document.getElementById('ggCheckBtn');
    if (cb && ggDifficulty !== 'hard') { cb.disabled = false; cb.style.opacity = '1'; cb.style.cursor = ''; }
    ggRenderGuessScore();
  };
}

function ggRenderSVG(data, containerId) {
  const cont = document.getElementById(containerId);
  if (!cont) return;
  const w = 80, h = 60;
  const inst = ['hihat', 'snare', 'kick'];
  const y = [15, 30, 45];
  const color = { hihat: 'var(--blue)', snare: 'var(--red)', kick: '#888' };
  let svg = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:400px;margin:0 auto;display:block;border:1px solid var(--border);border-radius:3px;background:white;">`;
  for (let i = 0; i < inst.length; i++) {
    const dots = data[inst[i]] || [];
    for (let j = 0; j < Math.min(dots.length, 16); j++) {
      if (dots[j]) {
        svg += `<circle cx="${8+j*4.5}" cy="${y[i]}" r="2" fill="var(--ink)" />`;
      }
    }
  }
  svg += '</svg>';
  cont.innerHTML = svg;
}

function ggRenderGuessScore() { ggRenderSVG(ggGuessData, 'ggGuessScore'); }
function ggRenderAnswerScore() { ggRenderSVG(ggAnswerData, 'ggAnswerScore'); }

function getNdClass(state, isX) {
  if (state === 0) return '';
  return isX ? 'on xhead' : 'on';
}

function ggUpdateStreak(correct) {
  if (correct) {
    ggStreak++;
  } else {
    ggStreak = 0;
    ggRenderHighScores();
  }
  const el = document.getElementById('ggStreakNum');
  if (el) el.textContent = ggStreak;
}

function ggConfetti() {
  const confettiPieces = ['🎉', '✨', '🎊', '⭐', '🌟'];
  const count = 50;
  const spawnDuration = 1.2;
  
  for (let i = 0; i < count; i++) {
    const spawnDelay = (i / count) * spawnDuration;
    
    setTimeout(() => {
      const piece = document.createElement('div');
      piece.className = 'confetti';
      piece.textContent = confettiPieces[Math.floor(Math.random() * confettiPieces.length)];
      
      const startX = Math.random() * window.innerWidth;
      const startY = -30;
      piece.style.left = startX + 'px';
      piece.style.top = startY + 'px';
      
      const tx = (Math.random() - 0.5) * 400;
      const ty = window.innerHeight + 60;
      const delay = Math.random() * 0.3;
      
      piece.style.setProperty('--tx', tx + 'px');
      piece.style.setProperty('--ty', ty + 'px');
      piece.style.animationDelay = delay + 's';
      
      document.body.appendChild(piece);
      
      setTimeout(() => piece.remove(), 2800 + delay * 1000);
    }, spawnDelay * 1000);
  }
}

function ggApplyHighlights(mode) {
  if (!ggAnswerData) return;
  const answerDiv = Object.values(ggAnswerData).find(a => Array.isArray(a))?.length || MG_DIV;
  const guessDiv  = ggGuessDivision;
  let wrongNotes = 0, missingNotes = 0;

  GG_INSTS.forEach(inst => {
    for (let s = 0; s < guessDiv; s++) {
      const guessDataStep = guessDiv === 8 ? s * 2 : s;
      const answerDataStep = answerDiv === guessDiv ? guessDataStep : (answerDiv === 16 && guessDiv === 8 ? guessDataStep : Math.floor(guessDataStep / 2));
      
      const answerOn = (ggAnswerData[inst.id]?.[answerDataStep] || 0) > 0;
      const guessOn  = (ggGuessData[inst.id]?.[guessDataStep]  || 0) > 0;
      const cell = document.getElementById(`gg-cell-${inst.id}-${s}`);
      if (!cell) continue;
      cell.classList.remove('gg-correct', 'gg-wrong');

      if (mode === 'reveal') {
        cell.classList.add(answerOn === guessOn ? 'gg-correct' : 'gg-wrong');
        if (answerOn !== guessOn) wrongNotes++;
      } else {
        if (guessOn) {
          if (answerOn) {
            cell.classList.add('gg-correct');
          } else {
            cell.classList.add('gg-wrong');
            wrongNotes++;
          }
        } else if (answerOn) {
          missingNotes++;
        }
      }
    }
  });

  const result = document.getElementById('ggResult');
  if (mode === 'reveal') {
    if (wrongNotes === 0 && missingNotes === 0) {
      result.textContent = '✓ Perfect! Every note matches.';
      result.className = 'pass';
      ggUpdateStreak(true);
      ggConfetti();
    } else {
      result.textContent = `✗ ${wrongNotes + missingNotes} note${wrongNotes + missingNotes !== 1 ? 's' : ''} incorrect.`;
      result.className = 'fail';
      ggUpdateStreak(false);
    }
  } else {
    const parts = [];
    if (wrongNotes > 0)   parts.push(`${wrongNotes} wrong note${wrongNotes !== 1 ? 's' : ''}`);
    if (missingNotes > 0) parts.push(`${missingNotes} missing note${missingNotes !== 1 ? 's' : ''}`);
    if (parts.length === 0) {
      result.textContent = '✓ Looking good so far!';
      result.className = 'pass';
    } else {
      result.textContent = parts.join(' · ');
      result.className = 'fail';
    }
  }
}

function ggCheck() {
  if (!ggAnswerData) return;
  ggApplyHighlights('check');
  document.getElementById('ggCheckBtn').disabled = true;
  document.getElementById('ggCheckBtn').style.opacity = '0.35';
  document.getElementById('ggCheckBtn').style.cursor = 'not-allowed';
}

function ggReveal() {
  if (!ggAnswerData) { alert('Set a groove first!'); return; }
  ggRevealed = true;

  const revealBtn = document.getElementById('ggRevealBtn');
  if (revealBtn) {
    revealBtn.disabled = true;
    revealBtn.style.opacity = '0.35';
    revealBtn.style.cursor = 'not-allowed';
  }

  document.getElementById('ggAnswerScore').style.display = '';
  ggApplyHighlights('reveal');
}

function ggPlayGuess() { ggPlayPattern(ggGuessData); }
function ggPlayHidden() { ggPlayPattern(ggAnswerData); }

function ggPlayAnswer() { ggPlayPattern(ggAnswerData); }

function ggPlayPattern(data) {
  // Placeholder - would require audio library
  alert('Play feature requires audio setup');
}

function ggResetRound() {
  const defaultBeat = () => {
    const d = { hihat: new Array(MG_DIV).fill(0), snare: new Array(MG_DIV).fill(0), kick: new Array(MG_DIV).fill(0), crash: new Array(MG_DIV).fill(0), ride: new Array(MG_DIV).fill(0) };
    [0,2,4,6,8,10,12,14].forEach(s => { d.hihat[s] = 1; });
    d.kick[0] = 1; d.kick[8] = 1;
    d.snare[4] = 1; d.snare[12] = 1;
    return d;
  };
  ggGuessData = defaultBeat();
  ggStreak = 0;
  ggRevealed = false;
  document.getElementById('ggAnswerScore').style.display = 'none';
  document.getElementById('ggResult').textContent = '';
  document.getElementById('ggResult').className = '';
  document.querySelectorAll('.gg-cell').forEach(c => c.classList.remove('gg-correct','gg-wrong'));
  const el = document.getElementById('ggStreakNum');
  if (el) el.textContent = '0';
  const revealBtn = document.getElementById('ggRevealBtn');
  if (revealBtn) {
    revealBtn.disabled = false;
    revealBtn.style.opacity = '1';
    revealBtn.style.cursor = 'pointer';
  }
  ggRenderGuessScore();
  ggRenderGuessGrid();
  ggRenderAnswerScore();
}

function ggGetScores() {
  const stored = localStorage.getItem(GG_HS_KEY);
  return stored ? JSON.parse(stored) : {};
}

function ggSetScoreName(mode, idx, name) {
  const all = ggGetScores();
  if (all[mode] && all[mode][idx]) {
    all[mode][idx].name = name.trim().slice(0, 20);
    localStorage.setItem(GG_HS_KEY, JSON.stringify(all));
  }
}

function ggDeleteScoreName(mode, idx) {
  const all = ggGetScores();
  if (all[mode] && all[mode][idx]) {
    all[mode].splice(idx, 1);
    localStorage.setItem(GG_HS_KEY, JSON.stringify(all));
    ggRenderHighScores();
  }
}

function ggSwitchHsMode() {
  const modes = ['easy', 'medium', 'hard'];
  const currentIdx = modes.indexOf(ggHsViewMode);
  ggHsViewMode = modes[(currentIdx + 1) % modes.length];
  ggRenderHighScores();
}

function ggRenderHighScores() {
  const btn = document.getElementById('ggHsModeBtn');
  const list = document.getElementById('ggHsList');
  if (!btn || !list) return;

  btn.textContent = ggHsViewMode.charAt(0).toUpperCase() + ggHsViewMode.slice(1);
  btn.className = ggHsViewMode;

  const all = ggGetScores();
  const scores = (all[ggHsViewMode] || []).slice(0, 10);

  list.innerHTML = '';

  if (scores.length === 0) {
    const empty = document.createElement('div');
    empty.id = 'ggHsEmpty';
    empty.innerHTML = `No scores yet.<br>Hit + to add one!`;
    list.appendChild(empty);
  } else {
    const medals = ['gold','silver','bronze'];
    scores.forEach((entry, i) => {
      const row = document.createElement('div');
      row.className = 'gg-hs-row';

      const rank = document.createElement('span');
      rank.className = 'gg-hs-rank';
      rank.textContent = `${i + 1}.`;

      const scoreEl = document.createElement('span');
      scoreEl.className = `gg-hs-score ${medals[i] || ''}`;
      scoreEl.textContent = entry.score;

      const nameEl = document.createElement('div');
      nameEl.className = 'gg-hs-name';
      nameEl.title = 'Click to edit name';

      if (entry.name) {
        nameEl.textContent = entry.name;
      } else {
        nameEl.textContent = '—';
        nameEl.style.opacity = '0.3';
      }

      nameEl.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'text';
        input.value = entry.name || '';
        input.maxLength = 20;
        input.placeholder = 'Name…';
        input.className = 'gg-hs-name-input';
        nameEl.replaceWith(input);
        input.focus();
        input.select();

        const commit = () => {
          const mode = ggHsViewMode;
          ggSetScoreName(mode, i, input.value);
          ggRenderHighScores();
        };
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
          if (e.key === 'Escape') { input.removeEventListener('blur', commit); ggRenderHighScores(); }
        });
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'gg-hs-delete-btn';
      deleteBtn.title = 'Clear name';
      deleteBtn.textContent = '✕';
      deleteBtn.addEventListener('click', () => {
        ggDeleteScoreName(ggHsViewMode, i);
      });

      row.appendChild(rank);
      row.appendChild(scoreEl);
      row.appendChild(nameEl);
      row.appendChild(deleteBtn);
      list.appendChild(row);
    });
  }

  if (scores.length < 10) {
    const addBtn = document.createElement('button');
    addBtn.id = 'ggHsAddBtn';
    addBtn.title = 'Add entry';
    addBtn.textContent = '+';
    addBtn.addEventListener('click', () => ggShowNewEntryRow(list, addBtn));
    list.appendChild(addBtn);
  }
}

function ggShowNewEntryRow(list, addBtn) {
  addBtn.remove();

  const row = document.createElement('div');
  row.className = 'gg-hs-new-row';

  const rankEl = document.createElement('span');
  rankEl.className = 'gg-hs-rank';
  rankEl.textContent = '·';

  const scoreInput = document.createElement('input');
  scoreInput.type = 'number';
  scoreInput.min = '1';
  scoreInput.max = '9999';
  scoreInput.maxLength = 4;
  scoreInput.placeholder = '0';
  scoreInput.className = 'gg-hs-score-input';

  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.maxLength = 20;
  nameInput.placeholder = 'Name…';
  nameInput.className = 'gg-hs-name-input';

  row.appendChild(rankEl);
  row.appendChild(scoreInput);
  row.appendChild(nameInput);
  list.appendChild(row);

  scoreInput.focus();

  const commit = () => {
    const scoreVal = parseInt(scoreInput.value, 10);
    const nameVal = nameInput.value.trim();
    if (scoreVal > 0) {
      const all = ggGetScores();
      if (!all[ggHsViewMode]) all[ggHsViewMode] = [];
      all[ggHsViewMode].push({score: scoreVal, name: nameVal});
      all[ggHsViewMode].sort((a,b) => b.score - a.score);
      all[ggHsViewMode] = all[ggHsViewMode].slice(0, 10);
      localStorage.setItem(GG_HS_KEY, JSON.stringify(all));
    }
    ggRenderHighScores();
  };

  scoreInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); nameInput.focus(); }
    if (e.key === 'Escape') { ggRenderHighScores(); }
  });
  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { ggRenderHighScores(); }
  });
  nameInput.addEventListener('blur', () => {
    setTimeout(commit, 120);
  });
}

// Initialize
window.addEventListener('DOMContentLoaded', () => {
  ggRenderGuessScore();
  ggRenderGuessGrid();
  ggRenderAnswerScore();
  ggRenderHighScores();
});
</script>

</body>
</html>
